[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Shared dependency versions go here; crates opt in with `dep = { workspace = true }`.
clap = { version = "4", features = ["derive"] }
portscan = { path = "crates/portscan" }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
